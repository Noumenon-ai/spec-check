[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-check"
version = "1.0.0"
description = "Verify if AI-generated code actually matches your spec."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "NOUMENON", email = "hello@noumenon.ai"}]
keywords = ["spec", "verification", "ai", "code-quality", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
spec-check = "spec_check.cli:app"

[project.urls]
Homepage = "https://github.com/noumenon-ai/spec-check"
Repository = "https://github.com/noumenon-ai/spec-check"

[tool.setuptools.packages.find]
where = ["src"]
