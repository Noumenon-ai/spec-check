name: Spec Check
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install git+https://github.com/Noumenon-ai/spec-check.git
      - run: spec-check --spec-file SPEC.md --dir . --strict --format json
